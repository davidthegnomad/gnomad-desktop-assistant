[package]
name = "omni-taskbar-ai"
version = "0.2.0-1"
description = "Gnomad Desktop Assistant — alpha"
authors = ["Gnomad Studio"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "omni_taskbar_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "2.1"
enigo = "0.2"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
portable-pty = "0.9"
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
base64 = "0.22"
url = "2"
llama-cpp-2 = { version = "0.1.146", optional = true, default-features = false, features = ["openmp"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "0.1.146", optional = true, features = ["metal"] }

[features]
default = []
embedded-llm = ["dep:llama-cpp-2"]

