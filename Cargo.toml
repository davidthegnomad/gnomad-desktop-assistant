[workspace]
resolver = "2"
members = [
    "crates/gnomad-core",
    "crates/gnomad-gtk",
    "src-tauri",
]

[workspace.package]
edition = "2021"
authors = ["Gnomad Studio"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
