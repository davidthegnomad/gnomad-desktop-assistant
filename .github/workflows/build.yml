name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
            linux_artifacts: true
            linux_arch: x86_64
          - platform: ubuntu-24.04-arm
            args: "--bundles deb,appimage"
            linux_artifacts: true
            linux_arch: aarch64
          - platform: windows-latest
            args: "--bundles msi,nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Install Linux system deps
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm libxdo-dev xdg-utils

      - name: Frontend tests and build
        run: |
          npm run test
          npm run build
          cd src-tauri && cargo test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: warn

      - name: Upload Linux .deb
        if: matrix.linux_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-${{ matrix.linux_arch }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload Linux .rpm
        if: matrix.linux_artifacts == true && matrix.linux_arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-x86_64
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: matrix.linux_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ matrix.linux_arch }}
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
