name: GTK Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  gtk-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/gnomad-core
            crates/gnomad-gtk

      - name: Install GTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev \
            libgdk-pixbuf-2.0-dev librsvg2-dev patchelf \
            desktop-file-utils dpkg-dev curl file

      - name: Build deb + AppImage
        run: bash scripts/gtk-package-linux.sh

      - name: Smoke-check artifacts
        run: |
          ls -la target/gtk-packages/
          file target/gtk-packages/*.deb
          file target/gtk-packages/*.AppImage

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: gnomad-gtk-deb-${{ matrix.arch }}
          path: target/gtk-packages/*.deb
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: gnomad-gtk-appimage-${{ matrix.arch }}
          path: target/gtk-packages/*.AppImage
          if-no-files-found: error
