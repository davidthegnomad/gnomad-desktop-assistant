# Build and attach macOS, Linux, and Windows installers to GitHub Releases.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish assets to (e.g. v0.1.0-alpha)"
        required: true
        default: "v0.1.0-alpha"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
            rust_targets: ""
          - platform: windows-latest
            args: "--bundles msi,nsis"
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: "Gnomad ${{ steps.tag.outputs.name }}"
          releaseBody: |
            ## Gnomad Desktop Assistant — Alpha

            Download the installer for your platform below.

            | Platform | Files |
            |----------|--------|
            | **macOS** | `.dmg` (Universal) |
            | **Linux** | `.deb`, `.rpm`, `.AppImage` |
            | **Windows** | `.msi`, `-setup.exe` (NSIS) |

            See [Linux install guide](https://github.com/davidthegnomad/gnomad-desktop-assistant/blob/main/docs/LINUX_PACKAGES.md).
          prerelease: true
          includeUpdaterJson: true
          assetNamePattern: "gnomad-[name]-[version]-[platform][ext]"
          args: ${{ matrix.args }}
