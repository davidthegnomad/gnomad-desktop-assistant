# Flatpak manifest — build Gnomad from source with flatpak-builder.
# See docs/FLATPAK.md for prerequisites and commands.
#
#   flatpak-builder --user --install --force-clean build-dir com.gnomadstudio.Gnomad.yml

app-id: com.gnomadstudio.Gnomad
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
  - org.freedesktop.Sdk.Extension.rust-stable
command: gnomad
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.ayatana.indicator.application
build-options:
  append-path: /usr/lib/sdk/node20/bin:/usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/gnomad/cargo
    npm_config_offline: "true"
modules:
  - name: gnomad
    buildsystem: simple
    build-options:
      env:
        RUSTUP_HOME: /run/build/gnomad/rustup
    sources:
      - type: dir
        path: ../..
        skip:
          - node_modules
          - src-tauri/target
          - dist
          - .git
    build-commands:
      - npm ci --offline || npm ci
      - npm run build
      - cd src-tauri && cargo build --release
      - |
        if [ -f src-tauri/target/release/gnomad ]; then
          install -Dm755 src-tauri/target/release/gnomad /app/bin/gnomad
        else
          install -Dm755 src-tauri/target/release/omni-taskbar-ai /app/bin/gnomad
        fi
      - install -Dm644 packaging/flatpak/com.gnomadstudio.Gnomad.desktop /app/share/applications/com.gnomadstudio.Gnomad.desktop
      - install -Dm644 packaging/flatpak/com.gnomadstudio.Gnomad.metainfo.xml /app/share/metainfo/com.gnomadstudio.Gnomad.metainfo.xml
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.gnomadstudio.Gnomad.png
